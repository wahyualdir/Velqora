name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Trusted Web Activity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Keystore (Self-Signed)
        run: |
          keytool -genkey -v \
            -keystore velqora.keystore \
            -alias velqora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "velqora123456" \
            -keypass "velqora123456" \
            -dname "CN=Velqora, OU=Engineering, O=Velqora, L=Jakarta, S=DKI Jakarta, C=ID"

      - name: Build Android APK
        run: |
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath=velqora.keystore \
            --signingKeyAlias=velqora \
            --keyPassword=velqora123456 \
            --keyStorePassword=velqora123456

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velqora-Android-App-v1.1.0
          path: |
            *.apk
            app-*.apk
          retention-days: 30
