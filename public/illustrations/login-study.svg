<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" role="img" aria-label="Ilustrasi Mahasiswa Belajar dengan Buku dan Laptop">
  <!-- Defs & Reusable Tokens -->
  <defs>
    <linearGradient id="terracotta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0654F" />
      <stop offset="100%" stop-color="#C2553A" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C2553A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ground Ambient Base -->
  <ellipse cx="250" cy="430" rx="190" ry="16" fill="#F4ECE4" opacity="0.85" />
  <ellipse cx="230" cy="430" rx="140" ry="10" fill="#E8DCD1" opacity="0.6" />

  <!-- ============================================================
       FLOATING ASYMMETRIC SUPPORTING ELEMENTS
       ============================================================ -->

  <!-- 1. Floating Graduation Cap (Top Left) -->
  <g class="float-grad-cap" transform="translate(65, 85) rotate(-8)">
    <path d="M45 12 L82 28 L45 44 L8 28 Z" fill="#292524" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M22 35 L22 52 C22 62, 68 62, 68 52 L68 35" fill="#3D3835" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tassel -->
    <circle cx="45" cy="28" r="3.5" fill="#C2553A" />
    <path d="M45 28 Q30 35 26 48" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    <rect x="23" y="48" width="6" height="9" rx="2" fill="#FBBF24" />
  </g>

  <!-- 2. Floating AI Idea Lightbulb (Top Center) -->
  <g class="float-lightbulb" transform="translate(235, 55)">
    <!-- Glow aura -->
    <circle cx="20" cy="22" r="28" fill="#FBBF24" opacity="0.18" />
    <!-- Radiance Spark Rays -->
    <line x1="20" y1="-2" x2="20" y2="4" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="2" y1="10" x2="6" y2="14" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="10" x2="34" y2="14" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bulb Glass -->
    <path d="M10 24 C6 17, 9 6, 20 6 C31 6, 34 17, 30 24 C28 27, 26 29, 26 33 L14 33 C14 29, 12 27, 10 24 Z" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Filament Heart -->
    <path d="M17 22 Q20 16 23 22" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    <!-- Base -->
    <rect x="15" y="33" width="10" height="4" rx="1.5" fill="#E7D8C9" stroke="#292524" stroke-width="2" />
    <path d="M17 37 L23 37" stroke="#292524" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. Floating Analytics Bar Chart (Top Right) -->
  <g class="float-chart-card" transform="translate(365, 80) rotate(6)" filter="url(#soft-glow)">
    <rect x="0" y="0" width="76" height="52" rx="12" fill="#FFFFFF" stroke="#292524" stroke-width="2.5" />
    <!-- Mini Bars -->
    <rect x="14" y="28" width="9" height="14" rx="3" fill="#E7D8C9" stroke="#292524" stroke-width="1.8" />
    <rect x="28" y="20" width="9" height="22" rx="3" fill="#FBBF24" stroke="#292524" stroke-width="1.8" />
    <rect x="42" y="14" width="9" height="28" rx="3" fill="#C2553A" stroke="#292524" stroke-width="1.8" />
    <rect x="56" y="22" width="9" height="20" rx="3" fill="#10B981" stroke="#292524" stroke-width="1.8" />
    <!-- Sparkle Dot -->
    <circle cx="64" cy="10" r="2.5" fill="#C2553A" />
  </g>

  <!-- 4. Floating Document Note (Right Middle) -->
  <g class="float-note-card" transform="translate(405, 205) rotate(-10)" filter="url(#soft-glow)">
    <rect x="0" y="0" width="56" height="66" rx="8" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" />
    <!-- Folded Corner -->
    <path d="M42 0 L56 14 L42 14 Z" fill="#E7D8C9" stroke="#292524" stroke-width="2" stroke-linejoin="round" />
    <!-- Note Lines -->
    <line x1="10" y1="20" x2="34" y2="20" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="30" x2="44" y2="30" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="39" x2="40" y2="39" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="48" x2="28" y2="48" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    <!-- Checkmark Badge -->
    <circle cx="44" cy="54" r="5" fill="#10B981" stroke="#292524" stroke-width="1.5" />
    <path d="M42 54 L43.5 55.5 L46.5 52.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Scattered Knowledge Sparkles & Particles -->
  <!-- Top Left Sparkle -->
  <path d="M140 145 Q145 155 155 160 Q145 165 140 175 Q135 165 125 160 Q135 155 140 145 Z" fill="#C2553A" opacity="0.8" />
  <!-- Center Right Sparkle -->
  <path d="M360 220 Q363 226 369 229 Q363 232 360 238 Q357 232 351 229 Q357 226 360 220 Z" fill="#FBBF24" />
  <!-- Bottom Left Soft Dot -->
  <circle cx="85" cy="270" r="4" fill="#C2553A" opacity="0.6" />
  <circle cx="105" cy="360" r="3" fill="#FBBF24" opacity="0.7" />
  <circle cx="445" cy="330" r="4" fill="#E0654F" opacity="0.6" />

  <!-- ============================================================
       STUDY DESK & COZY ACCESSORIES (RIGHT SIDE)
       ============================================================ -->

  <!-- Minimalist Low Study Table / Stand -->
  <g id="study-table">
    <!-- Table Top -->
    <rect x="290" y="340" width="135" height="14" rx="7" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" />
    <!-- Table Legs -->
    <path d="M305 354 L295 425" stroke="#292524" stroke-width="3" stroke-linecap="round" />
    <path d="M410 354 L420 425" stroke="#292524" stroke-width="3" stroke-linecap="round" />
    <!-- Cross Strut -->
    <line x1="300" y1="395" x2="415" y2="395" stroke="#292524" stroke-width="2" stroke-linecap="round" />

    <!-- Open Laptop on Table -->
    <g id="laptop" transform="translate(305, 275)">
      <!-- Laptop Base -->
      <rect x="0" y="58" width="78" height="7" rx="3.5" fill="#E7D8C9" stroke="#292524" stroke-width="2.5" />
      <line x1="32" y1="60" x2="46" y2="60" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />
      <!-- Laptop Screen (Angled) -->
      <path d="M12 0 L66 0 C70 0, 72 3, 71 7 L64 58 L8 58 L1 7 C0 3, 2 0, 6 0 Z" fill="#FFFFFF" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Screen Display Content -->
      <rect x="7" y="6" width="58" height="46" rx="4" fill="#FAF6F1" />
      <!-- Velqora Dashboard Mockup Lines on Screen -->
      <rect x="11" y="10" width="14" height="4" rx="2" fill="#C2553A" />
      <rect x="11" y="18" width="22" height="14" rx="2" fill="#E8DCD1" />
      <rect x="36" y="18" width="25" height="14" rx="2" fill="#C2553A" opacity="0.2" />
      <line x1="39" y1="23" x2="56" y2="23" stroke="#C2553A" stroke-width="2" stroke-linecap="round" />
      <line x1="39" y1="28" x2="50" y2="28" stroke="#C2553A" stroke-width="2" stroke-linecap="round" />
      <rect x="11" y="36" width="50" height="12" rx="2" fill="#FFFFFF" stroke="#E8DCD1" stroke-width="1" />
    </g>

    <!-- Warm Coffee Mug beside Laptop -->
    <g id="mug" transform="translate(390, 316)">
      <!-- Steam curves -->
      <path d="M6 -10 Q10 -5 6 0" fill="none" stroke="#C2553A" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      <path d="M11 -8 Q15 -3 11 2" fill="none" stroke="#C2553A" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      <!-- Mug Body -->
      <rect x="0" y="6" width="18" height="18" rx="4" fill="#C2553A" stroke="#292524" stroke-width="2.5" />
      <!-- Handle -->
      <path d="M18 9 C23 9, 23 19, 18 20" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Mini Potted Succulent Plant under Table -->
    <g id="potted-plant" transform="translate(345, 385)">
      <!-- Pot -->
      <path d="M4 18 L18 18 L20 34 L2 34 Z" fill="#E7D8C9" stroke="#292524" stroke-width="2" stroke-linejoin="round" />
      <!-- Leaves -->
      <path d="M11 18 C7 10, 3 14, 6 18 Z" fill="#10B981" stroke="#292524" stroke-width="1.8" />
      <path d="M11 18 C15 10, 19 14, 16 18 Z" fill="#10B981" stroke="#292524" stroke-width="1.8" />
      <path d="M11 18 C11 8, 14 8, 11 18 Z" fill="#34D399" stroke="#292524" stroke-width="1.8" />
    </g>
  </g>

  <!-- ============================================================
       CHARACTER: GENDER-NEUTRAL STUDENT (RELAXED STUDY POSE)
       ============================================================ -->

  <g id="student-character">
    <!-- Floor Cushion / Beanbag Seat -->
    <ellipse cx="190" cy="415" rx="85" ry="20" fill="#F4ECE4" stroke="#292524" stroke-width="2.5" />
    <path d="M115 415 C115 428, 265 428, 265 415" fill="none" stroke="#292524" stroke-width="2.5" />

    <!-- Legs Crossed Comfortably -->
    <g id="character-legs">
      <!-- Right Leg / Thigh Fold -->
      <path d="M165 375 C145 385, 115 395, 125 412 C135 425, 185 415, 205 405" fill="#3D3835" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Left Leg / Fold across -->
      <path d="M215 375 C235 385, 265 395, 255 412 C245 425, 195 415, 175 405" fill="#292524" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Cozy Sock / Shoe Detail -->
      <ellipse cx="128" cy="412" rx="9" ry="6" fill="#FAF6F1" stroke="#292524" stroke-width="2" />
      <ellipse cx="252" cy="412" rx="9" ry="6" fill="#FAF6F1" stroke="#292524" stroke-width="2" />
    </g>

    <!-- Torso (Oversized Comfy Terracotta Sweater) -->
    <g id="character-torso">
      <!-- Body shape -->
      <path d="M150 245 C135 270, 140 375, 155 385 L225 385 C240 375, 245 270, 230 245 C215 235, 165 235, 150 245 Z" fill="url(#terracotta-grad)" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Sweater Collar Neckline -->
      <path d="M172 242 C172 254, 208 254, 208 242" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Subtle Fabric Crease -->
      <path d="M160 320 Q190 335 220 320" fill="none" stroke="#A9442C" stroke-width="2" stroke-linecap="round" />
      <path d="M165 355 Q190 365 215 355" fill="none" stroke="#A9442C" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Head & Neck -->
    <g id="character-head">
      <!-- Neck -->
      <rect x="183" y="222" width="14" height="24" rx="4" fill="#FCD9C4" stroke="#292524" stroke-width="2.5" />
      
      <!-- Head Base Silhouette (Warm Skin Tone) -->
      <circle cx="190" cy="195" r="30" fill="#FCD9C4" stroke="#292524" stroke-width="2.5" />

      <!-- Minimal Modern Crop Hair (Gender Neutral) -->
      <path d="M160 195 C158 170, 172 155, 190 155 C212 155, 224 168, 222 195 C218 178, 210 172, 195 172 C180 172, 168 182, 160 195 Z" fill="#292524" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Side fringe / hair volume -->
      <path d="M160 192 C162 180, 175 168, 192 168 C205 168, 218 176, 220 190 C212 182, 198 178, 185 182 C175 185, 168 190, 160 192 Z" fill="#3D3835" />

      <!-- Minimalist Facial Features (Modern SaaS Notion-Style) -->
      <!-- Round Wireframe Glasses -->
      <circle cx="180" cy="195" r="8" fill="#FFFFFF" fill-opacity="0.4" stroke="#292524" stroke-width="2" />
      <circle cx="202" cy="195" r="8" fill="#FFFFFF" fill-opacity="0.4" stroke="#292524" stroke-width="2" />
      <line x1="188" y1="195" x2="194" y2="195" stroke="#292524" stroke-width="2" />
      <!-- Eyes (Relaxed Dot Eyes inside glasses) -->
      <circle cx="180" cy="195" r="2" fill="#292524" />
      <circle cx="202" cy="195" r="2" fill="#292524" />
      <!-- Calm, Subtle Smile -->
      <path d="M186 210 Q191 214 196 210" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
      <!-- Soft Rosy Cheeks -->
      <circle cx="170" cy="204" r="3.5" fill="#E0654F" opacity="0.4" />
      <circle cx="210" cy="204" r="3.5" fill="#E0654F" opacity="0.4" />
    </g>

    <!-- Arms & Open Book (Center Foreground) -->
    <g id="character-arms-and-book">
      <!-- Left Arm resting inward -->
      <path d="M152 255 C132 285, 142 335, 165 345" fill="none" stroke="url(#terracotta-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M152 255 C132 285, 142 335, 165 345" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right Arm resting inward -->
      <path d="M228 255 C248 285, 238 335, 215 345" fill="none" stroke="url(#terracotta-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M228 255 C248 285, 238 335, 215 345" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Hands holding book -->
      <circle cx="160" cy="342" r="7" fill="#FCD9C4" stroke="#292524" stroke-width="2" />
      <circle cx="220" cy="342" r="7" fill="#FCD9C4" stroke="#292524" stroke-width="2" />

      <!-- Open Book in Lap -->
      <g id="open-book" transform="translate(150, 318)" filter="url(#soft-glow)">
        <!-- Book Cover Base -->
        <path d="M40 32 L5 24 C2 23, 0 20, 0 17 L0 3 C0 0, 3 -2, 6 -1 L40 8 L74 -1 C77 -2, 80 0, 80 3 L80 17 C80 20, 78 23, 75 24 Z" fill="#292524" stroke="#292524" stroke-width="2" stroke-linejoin="round" />
        
        <!-- Left Book Page -->
        <path d="M40 30 C28 26, 12 21, 4 20 L4 6 C12 7, 28 12, 40 16 Z" fill="#FAF6F1" stroke="#292524" stroke-width="2" stroke-linejoin="round" />
        <!-- Right Book Page -->
        <path d="M40 30 C52 26, 68 21, 76 20 L76 6 C68 7, 52 12, 40 16 Z" fill="#FFFFFF" stroke="#292524" stroke-width="2" stroke-linejoin="round" />
        
        <!-- Center Book Spine Crease -->
        <line x1="40" y1="16" x2="40" y2="30" stroke="#C2553A" stroke-width="2" />
        
        <!-- Bookmark Ribbon -->
        <path d="M40 30 Q44 42 40 46 L43 44 L46 47 Q43 38 40 30" fill="#C2553A" stroke="#292524" stroke-width="1.5" />

        <!-- Text Lines on Pages -->
        <!-- Left Page lines -->
        <line x1="9" y1="10" x2="33" y2="15" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />
        <line x1="9" y1="14" x2="33" y2="19" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />
        <line x1="9" y1="18" x2="26" y2="22" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />

        <!-- Right Page lines -->
        <line x1="47" y1="15" x2="71" y2="10" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />
        <line x1="47" y1="19" x2="71" y2="14" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" />
        <line x1="47" y1="23" x2="64" y2="19" stroke="#C2553A" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
