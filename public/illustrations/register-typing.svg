<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" role="img" aria-label="Ilustrasi Mahasiswa Mengetik di Laptop dan Mengatur Jadwal Perkuliahan">
  <!-- Defs & Reusable Gradients -->
  <defs>
    <linearGradient id="reg-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0654F" />
      <stop offset="100%" stop-color="#C2553A" />
    </linearGradient>
    <filter id="reg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C2553A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ground Ambient Floor -->
  <ellipse cx="250" cy="430" rx="190" ry="16" fill="#F4ECE4" opacity="0.85" />
  <ellipse cx="270" cy="430" rx="140" ry="10" fill="#E8DCD1" opacity="0.6" />

  <!-- ============================================================
       FLOATING ASYMMETRIC SUPPORTING ELEMENTS
       ============================================================ -->

  <!-- 1. Floating Graduation Cap (Top Right) -->
  <g transform="translate(365, 80) rotate(8)">
    <path d="M45 12 L82 28 L45 44 L8 28 Z" fill="#292524" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M22 35 L22 52 C22 62, 68 62, 68 52 L68 35" fill="#3D3835" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tassel -->
    <circle cx="45" cy="28" r="3.5" fill="#C2553A" />
    <path d="M45 28 Q30 35 26 48" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    <rect x="23" y="48" width="6" height="9" rx="2" fill="#FBBF24" />
  </g>

  <!-- 2. Floating AI Idea Spark (Top Left) -->
  <g transform="translate(75, 75) rotate(-6)">
    <!-- Glow aura -->
    <circle cx="20" cy="22" r="28" fill="#FBBF24" opacity="0.18" />
    <!-- Rays -->
    <line x1="20" y1="-2" x2="20" y2="4" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="2" y1="10" x2="6" y2="14" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="10" x2="34" y2="14" stroke="#C2553A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bulb Glass -->
    <path d="M10 24 C6 17, 9 6, 20 6 C31 6, 34 17, 30 24 C28 27, 26 29, 26 33 L14 33 C14 29, 12 27, 10 24 Z" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M17 22 Q20 16 23 22" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    <rect x="15" y="33" width="10" height="4" rx="1.5" fill="#E7D8C9" stroke="#292524" stroke-width="2" />
    <path d="M17 37 L23 37" stroke="#292524" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. Floating Task Checklist Badge (Left Mid) -->
  <g transform="translate(55, 195) rotate(6)" filter="url(#reg-glow)">
    <rect x="0" y="0" width="70" height="56" rx="10" fill="#FFFFFF" stroke="#292524" stroke-width="2.5" />
    <!-- Check 1 -->
    <circle cx="14" cy="18" r="4" fill="#10B981" />
    <line x1="24" y1="18" x2="56" y2="18" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    <!-- Check 2 -->
    <circle cx="14" cy="30" r="4" fill="#10B981" />
    <line x1="24" y1="30" x2="48" y2="30" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    <!-- Progress Bar -->
    <rect x="10" y="42" width="50" height="5" rx="2.5" fill="#FAF6F1" stroke="#292524" stroke-width="1.5" />
    <rect x="10" y="42" width="38" height="5" rx="2.5" fill="#C2553A" />
  </g>

  <!-- 4. Floating Calendar / Schedule Pill (Right Mid) -->
  <g transform="translate(395, 200) rotate(-8)" filter="url(#reg-glow)">
    <rect x="0" y="0" width="62" height="60" rx="10" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" />
    <rect x="0" y="0" width="62" height="18" rx="8" fill="#C2553A" stroke="#292524" stroke-width="2" />
    <circle cx="18" cy="9" r="2" fill="#FFFFFF" />
    <circle cx="44" cy="9" r="2" fill="#FFFFFF" />
    <!-- Calendar Grid Dots -->
    <circle cx="16" cy="28" r="2.5" fill="#292524" />
    <circle cx="31" cy="28" r="2.5" fill="#292524" />
    <circle cx="46" cy="28" r="2.5" fill="#10B981" />
    <circle cx="16" cy="42" r="2.5" fill="#292524" />
    <circle cx="31" cy="42" r="2.5" fill="#C2553A" />
    <circle cx="46" cy="42" r="2.5" fill="#292524" />
  </g>

  <!-- 5. Knowledge Sparkles -->
  <path d="M165 110 Q168 116 174 119 Q168 122 165 128 Q162 122 156 119 Q162 116 165 110 Z" fill="#C2553A" />
  <path d="M340 180 Q343 186 349 189 Q343 192 340 198 Q337 192 331 189 Q337 186 340 180 Z" fill="#FBBF24" />
  <circle cx="105" cy="320" r="3.5" fill="#C2553A" opacity="0.6" />
  <circle cx="420" cy="330" r="4" fill="#FBBF24" opacity="0.6" />

  <!-- ============================================================
       STUDENT CHARACTER & MAIN WORKSTATION DESK
       ============================================================ -->

  <!-- Modern Study Desk -->
  <g id="reg-desk">
    <!-- Desk Top Surface -->
    <rect x="140" y="325" width="220" height="16" rx="8" fill="#FAF6F1" stroke="#292524" stroke-width="2.5" />
    <!-- Desk Legs -->
    <path d="M160 341 L145 425" stroke="#292524" stroke-width="3" stroke-linecap="round" />
    <path d="M340 341 L355 425" stroke="#292524" stroke-width="3" stroke-linecap="round" />
    <!-- Footrest Bar -->
    <line x1="150" y1="395" x2="350" y2="395" stroke="#292524" stroke-width="2" stroke-linecap="round" />

    <!-- Open Laptop in Center -->
    <g id="reg-laptop" transform="translate(195, 245)">
      <!-- Base -->
      <rect x="0" y="74" width="110" height="8" rx="4" fill="#E7D8C9" stroke="#292524" stroke-width="2.5" />
      <line x1="45" y1="77" x2="65" y2="77" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
      <!-- Screen Display -->
      <rect x="10" y="0" width="90" height="74" rx="6" fill="#FFFFFF" stroke="#292524" stroke-width="2.5" />
      <rect x="16" y="6" width="78" height="62" rx="4" fill="#FAF6F1" />
      <!-- IDE / Editor Lines -->
      <rect x="22" y="12" width="24" height="4" rx="2" fill="#C2553A" />
      <line x1="22" y1="22" x2="52" y2="22" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="28" x2="68" y2="28" stroke="#292524" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="34" x2="60" y2="34" stroke="#C2553A" stroke-width="2" stroke-linecap="round" />
      <line x1="22" y1="40" x2="48" y2="40" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
      <rect x="22" y="48" width="66" height="14" rx="2" fill="#FFFFFF" stroke="#E8DCD1" stroke-width="1" />
      <circle cx="28" cy="55" r="2.5" fill="#10B981" />
      <line x1="36" y1="55" x2="78" y2="55" stroke="#78716C" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Warm Coffee Mug (Right of Desk) -->
    <g transform="translate(325, 302)">
      <path d="M4 -8 Q8 -4 4 0" fill="none" stroke="#C2553A" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      <rect x="0" y="4" width="16" height="18" rx="4" fill="#C2553A" stroke="#292524" stroke-width="2.2" />
      <path d="M16 8 C20 8, 20 16, 16 17" fill="none" stroke="#292524" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Stack of Books & Notebook (Left of Desk) -->
    <g transform="translate(150, 305)">
      <rect x="0" y="10" width="34" height="10" rx="3" fill="#292524" stroke="#292524" stroke-width="2" />
      <rect x="4" y="2" width="28" height="8" rx="2.5" fill="#FAF6F1" stroke="#292524" stroke-width="2" />
    </g>
  </g>

  <!-- ============================================================
       CHARACTER: STUDENT FOCUSED ON TYPING
       ============================================================ -->

  <g id="reg-student">
    <!-- Comfy Ergonomic Chair Backrest -->
    <path d="M210 230 C210 200, 290 200, 290 230 L285 360 L215 360 Z" fill="#F4ECE4" stroke="#292524" stroke-width="2.5" />
    <line x1="250" y1="360" x2="250" y2="425" stroke="#292524" stroke-width="3" stroke-linecap="round" />
    <path d="M230 425 L270 425" stroke="#292524" stroke-width="3" stroke-linecap="round" />

    <!-- Torso (Terracotta Sweater) -->
    <path d="M220 235 C205 260, 208 340, 218 350 L282 350 C292 340, 295 260, 280 235 C265 225, 235 225, 220 235 Z" fill="url(#reg-terracotta)" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M238 232 C238 244, 262 244, 262 232" fill="#FAF6F1" stroke="#292524" stroke-width="2" stroke-linejoin="round" />

    <!-- Head & Hair -->
    <rect x="244" y="210" width="12" height="24" rx="4" fill="#FCD9C4" stroke="#292524" stroke-width="2" />
    <circle cx="250" cy="185" r="28" fill="#FCD9C4" stroke="#292524" stroke-width="2.5" />
    
    <!-- Modern Minimalist Hair -->
    <path d="M222 185 C220 160, 234 148, 250 148 C270 148, 280 158, 278 185 C274 170, 268 165, 255 165 C242 165, 230 172, 222 185 Z" fill="#292524" stroke="#292524" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M222 182 C225 172, 238 162, 252 162 C264 162, 274 170, 276 180 C270 174, 258 170, 246 174 C236 177, 230 180, 222 182 Z" fill="#3D3835" />

    <!-- Glasses & Eyes Focused Downward toward Laptop -->
    <circle cx="240" cy="186" r="7.5" fill="#FFFFFF" fill-opacity="0.4" stroke="#292524" stroke-width="1.8" />
    <circle cx="260" cy="186" r="7.5" fill="#FFFFFF" fill-opacity="0.4" stroke="#292524" stroke-width="1.8" />
    <line x1="247.5" y1="186" x2="252.5" y2="186" stroke="#292524" stroke-width="1.8" />
    <!-- Focused Eyes looking down -->
    <circle cx="240" cy="187" r="1.8" fill="#292524" />
    <circle cx="260" cy="187" r="1.8" fill="#292524" />
    <!-- Confident Smile -->
    <path d="M246 200 Q250 203 254 200" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
    <circle cx="232" cy="195" r="3" fill="#E0654F" opacity="0.4" />
    <circle cx="268" cy="195" r="3" fill="#E0654F" opacity="0.4" />

    <!-- Arms Resting on Desk & Hands on Laptop Keyboard -->
    <g id="reg-arms">
      <!-- Left Arm -->
      <path d="M222 245 C202 275, 205 315, 228 322" fill="none" stroke="url(#reg-terracotta)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M222 245 C202 275, 205 315, 228 322" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Arm -->
      <path d="M278 245 C298 275, 295 315, 272 322" fill="none" stroke="url(#reg-terracotta)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M278 245 C298 275, 295 315, 272 322" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Hands on Keyboard -->
      <circle cx="232" cy="322" r="6.5" fill="#FCD9C4" stroke="#292524" stroke-width="2" />
      <circle cx="268" cy="322" r="6.5" fill="#FCD9C4" stroke="#292524" stroke-width="2" />
    </g>
  </g>
</svg>
